 var seller=['What exactly is being sold: '+(t.Form?'the legal form here is '+t.Form.toLowerCase()+'. Which part of that is on offer?':'the object, a share of it, a claim on it, or a wrapper?'),'Who verified it, and can I see the document? '+(p.Verifier?'In this market that is: '+p.Verifier+'.':''),(p.Claim&&p.Claim!=='—'?'The claim most often wrong in this market is "'+p.Claim+'". What evidence supports it for this piece?':'What evidence supports the stated origin, grade or attribution?'),'Who has owned it before, and is there a gap in the chain?','Is the price a transaction price or a list price? '+(ps.Who?'The reference in this market: '+ps.Who+'.':'')+(ps.Regime?' Regime: '+ps.Regime+'.':''),'If I wanted to sell this back next month, to whom, and at what discount to today\'s price?'];
 var dealer=['Are you acting as agent or as principal? '+(a.Config?'Typical here: '+a.Config+'.':''),'What is the all-in cost on both sides? '+(a.Cost?'Published range: '+a.Cost+'.':''),'How often does this door open? '+(e.Open?'The brief records: '+e.Open+'.':''),'What is your bid today for a comparable piece, and what did the last three actually clear at?','Which claims will you put in writing, and what is the remedy if one proves false?','Are you paid by anyone other than me on this transaction?'];
